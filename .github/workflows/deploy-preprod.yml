name: Deploy Pre-Production

on:
  push:
    branches:
      - pre-prod

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Build
        run: npm run build

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: pre-production
    steps:
      - uses: actions/checkout@v4

      - name: Check pre-prod slot configured
        id: slot
        run: |
          if [ -z "${{ secrets.PREPROD_DEPLOY_PATH }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pre-prod slot not configured::PREPROD_DEPLOY_PATH secret not set — CI gate passed; SSH deploy skipped until pre-prod slot is ready on EC2."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH key
        if: steps.slot.outputs.configured == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add EC2 host to known_hosts
        if: steps.slot.outputs.configured == 'true'
        run: |
          ssh-keyscan -t ed25519 -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Build & Deploy to pre-prod slot
        if: steps.slot.outputs.configured == 'true'
        run: |
          ssh -i ~/.ssh/id_ed25519 ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            cd ${{ secrets.PREPROD_DEPLOY_PATH }}
            git stash
            git pull origin pre-prod
            docker compose -f docker-compose.frontend.yml down
            docker compose -f docker-compose.frontend.yml up --build -d
          EOF

      - name: Done
        if: steps.slot.outputs.configured == 'true'
        run: echo "Admin frontend deployed successfully to pre-prod slot"
