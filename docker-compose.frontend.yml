services:
  frontend:
    container_name: ${FE_CONTAINER_NAME:-grub-admin-frontend}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FE_HOST_PORT:-3000}:3000"
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - frontend-network

networks:
  frontend-network:
    driver: bridge
    name: ${FE_DOCKER_NETWORK:-grubadmin-fe-network}
